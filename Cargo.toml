[package]
name = "retrackt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "TrackMania-style time-trial racer and track editor on repame (dogfood)"
repository = "https://github.com/mlm-games/retrackt"
readme = "README.md"
keywords = ["gamedev", "game", "racing", "repose"]
categories = ["game-development"]
rust-version = "1.98"
default-run = "retrackt-desktop"

[lib]
name = "retrackt"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "retrackt-desktop"
path = "src/main.rs"

[dependencies]
retrackt-format = { path = "crates/retrackt-format" }
repame-sim = "0.3"
repame-shell = "0.3"
repame-input = "0.3"
repame-view3d = "0.3"
repose-core = "0.31"
repose-ui = "0.31"
repose-material = "0.31"
game-utils = "0.4"
game-utils-vehicle = "0.4"
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"

[package.metadata.android]
package = "org.mlm.retrackt"
apk_name = "retrackt"
build_targets = ["aarch64-linux-android"]
resources = "packaging/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37

[package.metadata.android.application]
label = "Retrackt"
icon = "@mipmap/ic_launcher"

