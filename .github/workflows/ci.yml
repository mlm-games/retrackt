name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mlm-games/ci/.github/workflows/rust-app-ci.yml@main
    with:
      run-fmt: true
      run-test: true
      extra-checks: |
        --target wasm32-unknown-unknown
      include-android: true
      cargo-rapk-version: "0.23.1"
      upload-artifacts: true
      app-slug: retrackt-desktop

  # The shared workflow's steps, run again here so that each one says what it
  # objected to.
  #
  # It builds the library, checks a second target, runs the tests and checks the
  # formatting, and every one of those says only pass or fail in a log the checks
  # API will not hand back. A red build is therefore just a red build: no test
  # output, and no compiler diagnostics for anything that only breaks under
  # `#[cfg(test)]` or on one target. Mirroring the steps and turning their output
  # into workflow annotations is what makes the failure readable at all.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run every step, keeping what each one said
        run: |
          mkdir -p reports
          run_step() {
            name="$1"; shift
            echo "::group::$name"
            set +e
            "$@" > "reports/$name.log" 2>&1
            echo $? > "reports/$name.status"
            set -e
            cat "reports/$name.log"
            echo "::endgroup::"
          }
          run_step build cargo build
          run_step wasm-check cargo check --target wasm32-unknown-unknown
          run_step type-check cargo check --workspace --all-targets
          run_step test cargo test --workspace
          run_step fmt cargo fmt --all -- --check
      - name: Report each objection as an annotation
        run: |
          status=0
          for report in reports/*.status; do
            name=$(basename "$report" .status)
            code=$(cat "$report")
            log="reports/$name.log"
            title="selfcheck"
            {
              grep -E '^(error|warning)(\[|:)' "$log" || true
              grep -A 4 '^---- .* stdout ----' "$log" || true
              grep -E '^failures:$' -A 20 "$log" || true
              grep -E '^Diff in ' "$log" || true
            } | grep -vE '^(note:|help:|\s*\||\s*=|\s*[0-9]+ *\||$)' | head -40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" \
                | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
              printf "::error title=%s/%s::%s\n" "$title" "$name" "$clean"
            done
            if [ "$code" != "0" ]; then
              status=1
              printf '::error title=%s/%s::exited %s\n' "$title" "$name" "$code"
            fi
          done
          exit $status
