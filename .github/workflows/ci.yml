name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mlm-games/ci/.github/workflows/rust-app-ci.yml@main
    with:
      run-fmt: true
      run-test: true
      extra-checks: |
        --target wasm32-unknown-unknown
      include-android: true
      cargo-rapk-version: "0.23.1"
      upload-artifacts: true
      app-slug: retrackt-desktop

  # Type-check the test targets and say what is wrong, as annotations.
  #
  # The shared workflow builds the library for every platform and runs the tests
  # separately, but nothing in it compiles the test targets on its own: a type
  # error that only exists under `#[cfg(test)]` fails every test job at once and
  # says nothing about which line. And rustc's own output does not come back
  # through the checks API, so a red build is otherwise just a red build. This
  # job turns each compiler error into a workflow annotation, which does.
  test-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Type-check the test targets
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/check.log || true
      - name: Report each compiler error as an annotation
        run: |
          status=0
          while IFS= read -r line; do
            case "$line" in
              error*) status=1 ;;
            esac
            clean=$(printf '%s' "$line" \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
            printf '::error title=type error::%s\n' "$clean"
          done < <(grep -E '^(error|warning)(\[|:)' /tmp/check.log | head -40)
          exit $status

  # Run the tests once, here, and name the failures as annotations.
  #
  # The platform jobs say pass or fail and nothing more, and their logs do not
  # come back through the checks API. Running the same tests once more and turning
  # each failure into an annotation is what makes a red build say which assertion
  # failed rather than only that something did.
  test-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/test.log || true
      - name: Report each failure as an annotation
        run: |
          status=0
          if grep -qE '^(test result: FAILED|failures:)' /tmp/test.log; then
            status=1
          fi
          {
            grep -A 3 '^---- .* stdout ----' /tmp/test.log || true
            grep -E '^failures:$' -A 20 /tmp/test.log || true
          } | grep -vE '^(note:|help:|\s*\||\s*=|\s*[0-9]+ *\||$)' | head -60 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
            printf '::error title=failed test::%s\n' "$clean"
          done
          exit $status
